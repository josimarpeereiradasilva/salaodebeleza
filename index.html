<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login e Cadastro Completo</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #ffffff;
      color: #f8f2f2;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 00px; /* Tamanho base da fonte */
    }
    .input-light {
      background-color: #f9fafb;
      border: 1px solid #d1d5db;
      color: #000000;
      font-size: 00px;
      transition: all 0.2s ease;
    }
    .input-light:focus {
      border-color: #e3e5eb;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    .input-light::placeholder {
      color: #6b7280;
    }
    .btn-primary {
      background-color: #000000;
      color: #ffffff;
      font-weight: 10;
      font-size: 00px;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background-color: #111111;
    }
    /* Estilizar scrollbar */
    ::-webkit-scrollbar {
      background: #f3f4f6;
    }
    ::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 py-12 space-y-12 bg-white text-black text-[14px]">

  <!-- ==================== TELA DE LOGIN (PARTE SUPERIOR) ==================== -->
  <div class="w-full max-w-2xl bg-white border border-gray-200 rounded-2xl shadow-xl p-6 sm:p-10">
    <form id="form-login" onsubmit="handleLogin(event)" class="space-y-5">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-black flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket text-gray-700"></i> Acesse sua Conta
        </h2>
        <p class="text-[14px] text-gray-700 mt-1">Informe suas credenciais para entrar na plataforma.</p>
      </div>

      <div>
        <label class="block text-[14px] font-medium text-black mb-1">E-mail</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <input type="email" required placeholder="seu@email.com" class="w-full pl-10 pr-4 py-2.5 rounded-xl text-[14px] input-light">
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-[14px] font-medium text-black">Senha</label>
          <a href="#" class="text-[14px] text-gray-700 hover:text-black transition-colors">Esqueceu a senha?</a>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-10 py-2.5 rounded-xl text-[14px] input-light">
          <button type="button" onclick="togglePassword('login-password', 'login-eye')" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-black">
            <i id="login-eye" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center">
        <input type="checkbox" id="remember" class="w-4 h-4 rounded bg-gray-100 border-gray-300 text-black cursor-pointer">
        <label for="remember" class="ml-2 text-[14px] text-gray-800 cursor-pointer">Lembrar acesso neste navegador</label>
      </div>

      <button type="submit" class="w-full py-3 rounded-xl btn-primary text-[14px] tracking-wide">
        Entrar
      </button>
    </form>
  </div>


  <!-- Divisor Visual -->
  <div class="flex items-center w-full max-w-2xl px-4">
    <div class="flex-grow border-t border-gray-300"></div>
    <span class="px-4 text-[14px] font-semibold text-gray-600 uppercase tracking-wider">Ainda não tem conta? Veja abaixo</span>
    <div class="flex-grow border-t border-gray-300"></div>
  </div>


  <!-- ==================== TELA DE CADASTRO COMPLETO (PARTE INFERIOR) ==================== -->
  <div class="w-full max-w-2xl bg-white border border-gray-200 rounded-2xl shadow-xl p-6 sm:p-10">
    <form id="form-register" onsubmit="handleRegister(event)" class="space-y-6">
      
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-black flex items-center justify-center gap-2">
          <i class="fa-solid fa-user-plus text-gray-700"></i> Cadastro de Usuário
        </h2>
        <p class="text-[14px] text-gray-700 mt-1">Preencha suas informações pessoais, endereço e dados de acesso.</p>
      </div>

      <!-- Seção 1: Dados Pessoais -->
      <div class="space-y-4">
        <h3 class="text-[14px] font-bold text-black uppercase tracking-wider border-b border-gray-200 pb-1">
          1. Dados Pessoais
        </h3>

        <div>
          <label class="block text-[14px] font-medium text-black mb-1">Nome Completo *</label>
          <input type="text" id="reg-nome" required placeholder="Ex: João da Silva" class="w-full px-3 py-2.5 rounded-xl text-[14px] input-light">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-[14px] font-medium text-black mb-1">CPF *</label>
            <input type="text" id="reg-cpf" required placeholder="000.000.000-00" maxlength="14" oninput="maskCPF(this)" class="w-full px-3 py-2.5 rounded-xl text-[14px] input-light">
          </div>
          <div>
            <label class="block text-[14px] font-medium text-black mb-1">Data de Nascimento *</label>
            <input type="date" id="reg-nascimento" required class="w-full px-3 py-2.5 rounded-xl text-[14px] input-light text-black">
          </div>
        </div>

        <div>
          <label class="block text-[14px] font-medium text-black mb-1">Telefone / WhatsApp *</label>
          <input type="text" id="reg-telefone" required placeholder="(11) 99999-9999" maxlength="15" oninput="maskPhone(this)" class="w-full px-3 py-2.5 rounded-xl text-[14px] input-light">
        </div>
      </div>

      <!-- Seção 2: Endereço -->
      <div class="space-y-4">
        <h3 class="text-[14px] font-bold text-black uppercase tracking-wider border-b border-gray-200 pb-1">
          2. Endereço
        </h3>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="sm:col-span-1">
            <label class="block text-[14px] font-medium text-black mb-1">CEP *</label>
            <input type="text" id="reg-cep" required placeholder="00000-000" maxlength="9" onkeyup="maskCEP(this); buscarCEP(this.value)" class="w-full px-3 py-2.5 rounded-xl text-[14px] input-light">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-[14px] font-medium text-black mb-1">Rua / Logradouro *</label>
            <input type="text" id="reg-rua" required placeholder="Rua / Avenida" class="w-full px-3 py-2.5 rounded-xl text-[14px] input-light">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-[14px] font-medium text-black mb-1">Número *</label>
            <input type="text" id="reg-numero" required placeholder="123" class="w-full px-3 py-2.5 rounded-xl text-[14px] input-light">
          </div>
          <div>
            <label class="block text-[14px] font-medium text-black mb-1">Complemento</label>
            <input type="text" id="reg-complemento" placeholder="Apt, Bloco..." class="w-full px-3 py-2.5 rounded-xl text-[14px] input-light">
          </div>
          <div>
            <label class="block text-[14px] font-medium text-black mb-1">Bairro *</label>
            <input type="text" id="reg-bairro" required placeholder="Bairro" class="w-full px-3 py-2.5 rounded-xl text-[14px] input-light">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="sm:col-span-2">
            <label class="block text-[14px] font-medium text-black mb-1">Cidade *</label>
            <input type="text" id="reg-cidade" required placeholder="Cidade" class="w-full px-3 py-2.5 rounded-xl text-[14px] input-light">
          </div>
          <div>
            <label class="block text-[14px] font-medium text-black mb-1">Estado (UF) *</label>
            <select id="reg-uf" required class="w-full px-3 py-2.5 rounded-xl text-[14px] input-light text-black">
              <option value="" class="bg-white text-black">UF</option>
              <option value="AC" class="bg-white text-black">AC</option>
              <option value="AL" class="bg-white text-black">AL</option>
              <option value="AP" class="bg-white text-black">AP</option>
              <option value="AM" class="bg-white text-black">AM</option>
              <option value="BA" class="bg-white text-black">BA</option>
              <option value="CE" class="bg-white text-black">CE</option>
              <option value="DF" class="bg-white text-black">DF</option>
              <option value="ES" class="bg-white text-black">ES</option>
              <option value="GO" class="bg-white text-black">GO</option>
              <option value="MA" class="bg-white text-black">MA</option>
              <option value="MT" class="bg-white text-black">MT</option>
              <option value="MS" class="bg-white text-black">MS</option>
              <option value="MG" class="bg-white text-black">MG</option>
              <option value="PA" class="bg-white text-black">PA</option>
              <option value="PB" class="bg-white text-black">PB</option>
              <option value="PR" class="bg-white text-black">PR</option>
              <option value="PE" class="bg-white text-black">PE</option>
              <option value="PI" class="bg-white text-black">PI</option>
              <option value="RJ" class="bg-white text-black">RJ</option>
              <option value="RN" class="bg-white text-black">RN</option>
              <option value="RS" class="bg-white text-black">RS</option>
              <option value="RO" class="bg-white text-black">RO</option>
              <option value="RR" class="bg-white text-black">RR</option>
              <option value="SC" class="bg-white text-black">SC</option>
              <option value="SP" class="bg-white text-black">SP</option>
              <option value="SE" class="bg-white text-black">SE</option>
              <option value="TO" class="bg-white text-black">TO</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Seção 3: Credenciais -->
      <div class="space-y-4">
        <h3 class="text-[14px] font-bold text-black uppercase tracking-wider border-b border-gray-200 pb-1">
          3. Credenciais de Acesso
        </h3>

        <div>
          <label class="block text-[14px] font-medium text-black mb-1">E-mail *</label>
          <input type="email" id="reg-email" required placeholder="seu@email.com" class="w-full px-3 py-2.5 rounded-xl text-[14px] input-light">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-[14px] font-medium text-black mb-1">Senha *</label>
            <div class="relative">
              <input type="password" id="reg-password" required placeholder="••••••••" minlength="6" class="w-full px-3 py-2.5 pr-10 rounded-xl text-[14px] input-light">
              <button type="button" onclick="togglePassword('reg-password', 'reg-eye-1')" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-black">
                <i id="reg-eye-1" class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <div>
            <label class="block text-[14px] font-medium text-black mb-1">Confirmar Senha *</label>
            <div class="relative">
              <input type="password" id="reg-confirm-password" required placeholder="••••••••" minlength="6" class="w-full px-3 py-2.5 pr-10 rounded-xl text-[14px] input-light">
              <button type="button" onclick="togglePassword('reg-confirm-password', 'reg-eye-2')" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-black">
                <i id="reg-eye-2" class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Aceite de Termos -->
      <div class="flex items-start">
        <input type="checkbox" id="terms" required class="mt-0.5 w-4 h-4 rounded bg-gray-100 border-gray-300 text-black cursor-pointer">
        <label for="terms" class="ml-2 text-[14px] text-gray-800">
          Declaro que li e aceito os <a href="#" class="text-black font-semibold underline">Termos de Uso</a> e a <a href="#" class="text-black font-semibold underline">Política de Privacidade</a>.
        </label>
      </div>

      <button type="submit" class="w-full py-3.5 rounded-xl btn-primary text-[14px] tracking-wide font-bold">
        Concluir Cadastro
      </button>

    </form>
  </div>

  <script>
    // Mostrar/Ocultar Senha
    function togglePassword(inputId, eyeIconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(eyeIconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    // Máscaras
    function maskCPF(i) {
      let v = i.value.replace(/\D/g, "");
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      i.value = v;
    }

    function maskPhone(i) {
      let v = i.value.replace(/\D/g, "");
      v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
      v = v.replace(/(\d)(\d{4})$/, "$1-$2");
      i.value = v;
    }

    function maskCEP(i) {
      let v = i.value.replace(/\D/g, "");
      v = v.replace(/^(\d{5})(\d)/, "$1-$2");
      i.value = v;
    }

    // Busca de CEP via API ViaCEP
    function buscarCEP(cepRaw) {
      const cep = cepRaw.replace(/\D/g, '');
      if (cep.length === 8) {
        fetch(`https://viacep.com.br/ws/${cep}/json/`)
          .then(res => res.json())
          .then(data => {
            if (!data.erro) {
              document.getElementById('reg-rua').value = data.logradouro;
              document.getElementById('reg-bairro').value = data.bairro;
              document.getElementById('reg-cidade').value = data.localidade;
              document.getElementById('reg-uf').value = data.uf;
              document.getElementById('reg-numero').focus();
            }
          })
          .catch(() => {});
      }
    }

    // Handlers
    function handleLogin(e) {
      e.preventDefault();
      alert('Login efetuado!');
    }

    function handleRegister(e) {
      e.preventDefault();
      const p1 = document.getElementById('reg-password').value;
      const p2 = document.getElementById('reg-confirm-password').value;

      if (p1 !== p2) {
        alert('As senhas não coincidem. Verifique novamente.');
        return;
      }
      alert('Cadastro de usuário efetuado com sucesso!');
    }
  </script>
</body>
</html>
